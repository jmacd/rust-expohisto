[package]
name = "rust-expohisto-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

[dependencies.rust-expohisto]
path = ".."

[workspace]
members = ["."]

[[bin]]
name = "histogram_oracle"
path = "fuzz_targets/histogram_oracle.rs"
doc = false

[[bin]]
name = "merge_oracle"
path = "fuzz_targets/merge_oracle.rs"
doc = false
