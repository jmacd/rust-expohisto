[package]
name = "rust-expohisto"
version = "0.1.0"
edition = "2021"
description = "Allocation-free OpenTelemetry Exponential Histogram"
license = "Apache-2.0"

[features]
default = ["newrelic-8"]

# Mapping algorithms - choose one for production, enable multiple for benchmarks.
# At least one must be enabled. If multiple are enabled, newrelic takes precedence.

# Pure logarithm-based mapping.
# Pros: No lookup tables, works for all scales, small binary size.
# Cons: Floating-point precision errors near bucket boundaries.
logarithm = []

# NewRelic lookup table-based mapping.
# Pros: Exact (no FP errors), fast integer-only computation.
# Cons: Larger binary size, table scale limits useful range.
# Choose a table size based on your max scale needs:
newrelic-4 = []     # 0.2KB, scales 1-4
newrelic-6 = []     # 0.8KB, scales 1-6
newrelic-8 = []     # 3KB, scales 1-8
newrelic-10 = []    # 12KB, scales 1-10
newrelic-12 = []    # 48KB, scales 1-12
newrelic-14 = []    # 192KB, scales 1-14

# Dynatrace lookup table-based mapping.
# Pros: Exact (no FP errors), ~50% smaller index table than NewRelic.
# Cons: Two branch corrections vs one; table scale limits useful range.
dynatrace-4 = []
dynatrace-6 = []
dynatrace-8 = []
dynatrace-10 = []
dynatrace-12 = []
dynatrace-14 = []

# For benchmarking all algorithms together
bench-all = ["logarithm", "newrelic-8", "dynatrace-8"]

[dependencies]

[build-dependencies]
expohisto-mapping-gen = { path = "mapping-gen" }

[dev-dependencies]
criterion = "0.5"
rand = "0.8"
expohisto-mapping-gen = { path = "mapping-gen" }

[[bench]]
name = "mapping"
harness = false
