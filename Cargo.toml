[package]
name = "otel-expohisto"
version = "0.1.0"
edition = "2021"
rust-version = "1.73"
description = "Allocation-free OpenTelemetry Exponential Histogram"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/open-telemetry/otel-expohisto"
keywords = ["opentelemetry", "histogram", "exponential", "metrics", "observability"]
categories = ["data-structures"]
exclude = ["fuzz/", "benches/", "mapping-gen/", ".github/", "CONTRIBUTING.md"]

[features]
default = ["newrelic", "scale-8"]

# Lookup table scale — choose the maximum accelerated scale.
# Each table supports all scales from 1 up to its maximum.
# Only one scale feature should be enabled; the highest wins.
scale-4 = []      # 0.2KB table, scales 1-4
scale-6 = []      # 0.8KB table, scales 1-6
scale-8 = []      # 3KB table, scales 1-8
scale-10 = []     # 12KB table, scales 1-10
scale-12 = []     # 48KB table, scales 1-12
scale-14 = []     # 192KB table, scales 1-14

# Mapping algorithms — choose one.
# Both produce identical results; they differ only in index table size and correction count.

# Pure logarithm-based mapping.
# Pros: No lookup tables, works for all scales, small binary size.
# Cons: Floating-point precision errors near bucket boundaries.
logarithm = []

# NewRelic lookup table-based mapping.
# Pros: Exact (no FP errors), fast integer-only computation.
# Cons: Larger binary size, table scale limits useful range.
newrelic = ["scale-4"]

# Dynatrace lookup table-based mapping.
# Pros: Exact (no FP errors), ~50% smaller index table than NewRelic.
# Cons: Two branch corrections vs one; table scale limits useful range.
dynatrace = ["scale-4"]

# For benchmarking all algorithms together
bench-all = ["logarithm", "newrelic", "dynatrace", "scale-8"]

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }

[build-dependencies]
expohisto-mapping-gen = { path = "mapping-gen" }

[dev-dependencies]
criterion = "0.5"
rand = "0.8"
expohisto-mapping-gen = { path = "mapping-gen" }

[[bench]]
name = "mapping"
harness = false

[[bench]]
name = "sub_byte"
harness = false

[[bench]]
name = "downscale"
harness = false

[[bench]]
name = "literal"
harness = false
