[package]
name = "otel-expohisto"
version = "0.1.0"
edition = "2021"
rust-version = "1.73"
description = "Allocation-free (after init) OpenTelemetry Exponential Histogram"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/open-telemetry/otel-expohisto"
keywords = ["opentelemetry", "histogram", "exponential", "metrics", "observability"]
categories = ["data-structures"]
exclude = ["fuzz/", "benches/", "mapping-gen/", ".github/", "CONTRIBUTING.md"]

[features]
default = ["newrelic", "scale-8"]

# Lookup table scale — choose the maximum accelerated scale.
# Each table supports all scales from 1 up to its maximum.
# Only one scale feature should be enabled; the highest wins.
# Scales above the table scale fall back to the built-in logarithm mapper.
scale-1 = []      #    16B table,  scale 1
scale-2 = []      #    40B table,  scales 1-2
scale-3 = []      #    88B table,  scales 1-3
scale-4 = []      #   152B table,  scales 1-4
scale-5 = []      #   280B table,  scales 1-5
scale-6 = []      #   536B table,  scales 1-6
scale-7 = []      #     1KB table, scales 1-7
scale-8 = []      #     2KB table, scales 1-8
scale-9 = []      #     4KB table, scales 1-9
scale-10 = []     #     8KB table, scales 1-10
scale-11 = []     #    16KB table, scales 1-11
scale-12 = []     #    32KB table, scales 1-12
scale-13 = []     #    64KB table, scales 1-13
scale-14 = []     #   128KB table, scales 1-14
scale-15 = []     #   256KB table, scales 1-15
scale-16 = []     #   512KB table, scales 1-16
scale-17 = []     #     1MB table, scales 1-17
scale-18 = []     #     2MB table, scales 1-18
scale-19 = []     #     4MB table, scales 1-19
scale-20 = []     #     8MB table, scales 1-20

# Mapping algorithms — choose one (or neither for pure logarithm).
# Both produce identical results; they differ only in index table size and correction count.
# Scales above the table scale automatically fall back to logarithm mapping.

# NewRelic lookup table-based mapping.
# Pros: Exact (no FP errors), fast integer-only computation.
# Cons: Larger binary size, table scale limits exact range.
newrelic = ["scale-4"]

# Dynatrace lookup table-based mapping.
# Pros: Exact (no FP errors), ~50% smaller index table than NewRelic.
# Cons: Two branch corrections vs one; table scale limits exact range.
dynatrace = ["scale-4"]

# For benchmarking all algorithms together
bench-all = ["newrelic", "dynatrace", "scale-8", "bench-internals"]

# Expose internal methods (e.g. do_downscale) for benchmarking
bench-internals = []

[dependencies]

[build-dependencies]
expohisto-mapping-gen = { path = "mapping-gen" }

[dev-dependencies]
criterion = "0.5"
rand = "0.8"
rand_distr = "0.4"
expohisto-mapping-gen = { path = "mapping-gen" }

[[bench]]
name = "mapping"
harness = false

[[bench]]
name = "sub_byte"
harness = false

[[bench]]
name = "downscale"
harness = false

[[bench]]
name = "literal"
harness = false
