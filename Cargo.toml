[package]
name = "rust-expohisto"
version = "0.1.0"
edition = "2021"
description = "Allocation-free OpenTelemetry Exponential Histogram"
license = "Apache-2.0"

[features]
default = ["std"]
std = []
# Lookup table sizes for map_to_index optimization (choose at most one)
lookup-64 = []    # 1.5KB table, supports up to scale 6
lookup-256 = []   # 6KB table, supports up to scale 8
lookup-1024 = []  # 24KB table, supports up to scale 10

[dependencies]
libm = "0.2"

[build-dependencies]
expohisto-mapping-gen = { path = "mapping-gen" }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "mapping"
harness = false
