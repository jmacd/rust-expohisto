[package]
name = "rust-expohisto"
version = "0.1.0"
edition = "2021"
description = "Allocation-free OpenTelemetry Exponential Histogram"
license = "Apache-2.0"

[features]
default = ["lookup-8"]
# Lookup table for map_to_index optimization. Choose one.
# Larger tables provide lookup acceleration for higher scales.
lookup-4 = []     # 0.2KB, scales 1-4
lookup-6 = []     # 0.8KB, scales 1-6
lookup-8 = []     # 3KB, scales 1-8
lookup-10 = []    # 12KB, scales 1-10
lookup-12 = []    # 48KB, scales 1-12
lookup-14 = []    # 192KB, scales 1-14

[dependencies]

[build-dependencies]
expohisto-mapping-gen = { path = "mapping-gen" }

[dev-dependencies]
criterion = "0.5"
rand = "0.8"

[[bench]]
name = "mapping"
harness = false
